<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Learn Build Scale Repeat" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="fg" x1="0" x2="1"><stop offset="0" stop-color="#00f7ff"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#ff4ecd"/></linearGradient><clipPath id="fc"><rect width="1200" height="200" rx="24"/></clipPath></defs>
<g clip-path="url(#fc)"><rect width="1200" height="200" fill="#05060f"/>
<path fill="url(#fg)" fill-opacity=".25"><animate attributeName="d" dur="8s" repeatCount="indefinite" values="M0 90 C200 40 400 140 600 90 S1000 40 1200 90 V200 H0Z;M0 90 C200 140 400 40 600 90 S1000 140 1200 90 V200 H0Z;M0 90 C200 40 400 140 600 90 S1000 40 1200 90 V200 H0Z"/></path>
<path fill="url(#fg)" fill-opacity=".4"><animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 120 C250 80 450 160 700 120 S1000 90 1200 120 V200 H0Z;M0 120 C250 160 450 80 700 120 S1000 150 1200 120 V200 H0Z;M0 120 C250 80 450 160 700 120 S1000 90 1200 120 V200 H0Z"/></path>
<path fill="#05060f" fill-opacity=".85"><animate attributeName="d" dur="10s" repeatCount="indefinite" values="M0 150 C300 120 500 180 800 150 S1100 130 1200 150 V200 H0Z;M0 150 C300 180 500 120 800 150 S1100 170 1200 150 V200 H0Z;M0 150 C300 120 500 180 800 150 S1100 130 1200 150 V200 H0Z"/></path>
<text x="600" y="78" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="url(#fg)" letter-spacing="6">LEARN &#183; BUILD &#183; SCALE &#183; REPEAT</text>
<text x="600" y="176" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" fill="#9fb0ff" letter-spacing="4">&#169; ENG. SHIINE &#183; MAREEG SOFTWARES</text></g>
</svg>